[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "nanouav"
version = "0.26.2"
description = "Monocular-depth + ToF obstacle avoidance for nano-UAVs: simulation, training and Gazebo evaluation"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "A. Infante" }]
dependencies = [
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "matplotlib>=3.7",
    "pyyaml>=6",
    "pillow>=9",
]

[project.optional-dependencies]
# int8 inference of the trained networks (closed-loop simulation with the real CNN)
tflite = ["ai-edge-litert>=1.0"]
# training (GPU). Pascal GPUs (e.g. TITAN X): see docs/gpu.md for the cuDNN pin
train = ["tensorflow>=2.16"]
# R19 person detection (YOLO, PyTorch); on a Jetson install the JetPack PyTorch first
follow = ["ultralytics>=8.3"]
flightmare = ["pyzmq>=25", "scipy"]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
nanouav = "nanouav.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long-running (closed-loop episode, rendering many frames)",
    "tflite: needs a TFLite runtime and models/model_M.tflite",
]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["docs", "gazebo/models"]

[tool.ruff.lint]
# Research code: only errors that indicate real bugs (syntax, undefined names, bad comparisons).
select = ["E9", "F63", "F7", "F82"]
